[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev:vite"
  targetPort = 3000
  port = 8888
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback — serve index.html for all client-side routes
# Netlify serves /.netlify/functions/* before this redirect (local + production)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
